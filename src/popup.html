<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
    h1 { font-size: 18px; color: #58a6ff; margin-bottom: 4px; }
    h1 span { color: #22c55e; }
    .sub { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
    textarea { width: 100%; height: 120px; background: #161b22; border: 1px solid #30363d; color: #c9d1d9; border-radius: 8px; padding: 10px; font-family: 'SF Mono', monospace; font-size: 12px; resize: vertical; }
    textarea:focus { outline: none; border-color: #58a6ff; }
    .btn { width: 100%; padding: 10px; background: #238636; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #2ea043; }
    .output { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px; margin-top: 12px; font-family: 'SF Mono', monospace; font-size: 12px; max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    .output:empty { display: none; }
    .footer { margin-top: 16px; text-align: center; font-size: 11px; color: #484f58; }
    .footer a { color: #58a6ff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>JSON <span>Hero</span></h1>
  <p class="sub">Paste JSON below or navigate to any JSON URL</p>
  <textarea id="input" placeholder='{"key": "value"}'></textarea>
  <button class="btn" id="format">Format & Beautify</button>
  <div class="output" id="output"></div>
  <div class="footer">
    <a href="https://github.com/Chesten223/json-hero" target="_blank">GitHub</a> · Zero ads · Zero tracking · Free forever
  </div>
  <script>
    document.getElementById('format').addEventListener('click', () => {
      try {
        const input = document.getElementById('input').value.trim();
        if (!input) return;
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        document.getElementById('output').textContent = formatted;
      } catch (e) {
        document.getElementById('output').textContent = '❌ Invalid JSON: ' + e.message;
      }
    });

    // Auto-format on paste
    document.getElementById('input').addEventListener('paste', () => {
      setTimeout(() => document.getElementById('format').click(), 50);
    });
  </script>
</body>
</html>
